name: Maintain pinned tools

on:
  schedule:
    - cron: "37 5 * * 6"
  workflow_dispatch:

concurrency:
  group: maintain-pinned-tools
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    name: Prepare pinned tool updates
    if: github.repository == '0nde/aws-archi'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: maintenance
    env:
      GH_TOKEN: ${{ secrets.MAINTENANCE_TOKEN }}
      BRANCH: bot/pinned-tool-updates
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require the dedicated maintenance identity
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "Configure the MAINTENANCE_TOKEN secret in the protected maintenance environment as documented in .github/MAINTENANCE.md" >&2
            exit 1
          fi
      - name: Test the maintenance updater
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Update manually managed pins
        run: python scripts/update-pins.py --summary "$RUNNER_TEMP/maintenance-summary.md"
      - id: changes
        name: Detect source changes
        run: |
          if [ -n "$(git status --porcelain -- .devcontainer/Dockerfile THIRD_PARTY_NOTICES.md third_party_licenses tooling/tool-versions.conf)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            cat "$RUNNER_TEMP/maintenance-summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Create a GitHub-signed maintenance commit
        if: steps.changes.outputs.changed == 'true'
        run: |
          git add .devcontainer/Dockerfile THIRD_PARTY_NOTICES.md third_party_licenses tooling/tool-versions.conf
          git diff --cached --check

          python - <<'PY' > "$RUNNER_TEMP/maintenance-commit.json"
          import base64
          import json
          import os
          import subprocess
          from pathlib import Path

          def changed_paths(diff_filter):
              result = subprocess.check_output([
                  "git", "diff", "--cached", "--name-only", "--no-renames",
                  f"--diff-filter={diff_filter}", "-z",
              ])
              return [os.fsdecode(path) for path in result.split(b"\0") if path]

          additions = [
              {"path": path, "contents": base64.b64encode(Path(path).read_bytes()).decode("ascii")}
              for path in changed_paths("AMT")
          ]
          deletions = [{"path": path} for path in changed_paths("D")]
          query = """mutation($input: CreateCommitOnBranchInput!) {
              createCommitOnBranch(input: $input) { commit { oid } }
          }"""
          print(json.dumps({
              "query": query,
              "variables": {"input": {
                  "branch": {
                      "repositoryNameWithOwner": os.environ["GITHUB_REPOSITORY"],
                      "branchName": f"refs/heads/{os.environ['BRANCH']}",
                  },
                  "expectedHeadOid": os.environ["GITHUB_SHA"],
                  "message": {"headline": "chore: update pinned tools"},
                  "fileChanges": {"additions": additions, "deletions": deletions},
              }},
          }))
          PY

          gh auth setup-git
          remote_sha=$(git ls-remote --heads origin "$BRANCH" | awk '{print $1}')
          git push --force-with-lease="refs/heads/${BRANCH}:${remote_sha}" \
            origin "${GITHUB_SHA}:refs/heads/${BRANCH}"
          commit_sha=$(gh api graphql --input "$RUNNER_TEMP/maintenance-commit.json" \
            --jq '.data.createCommitOnBranch.commit.oid')
          [[ "$commit_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "GitHub did not create the maintenance commit" >&2
            exit 1
          }
          verified=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${commit_sha}" \
            --jq '.commit.verification.verified')
          [ "$verified" = "true" ] || {
            echo "GitHub did not sign the maintenance commit" >&2
            exit 1
          }
      - name: Open or refresh maintenance pull request
        if: steps.changes.outputs.changed == 'true'
        run: |
          {
            cat "$RUNNER_TEMP/maintenance-summary.md"
            printf '\n%s\n\n%s\n' \
              "This pull request was prepared automatically but will not be merged automatically." \
              "Review the upstream releases and checksum changes, then wait for CodeQL, AMD64, ARM64 and Trivy validation before merging."
          } > "$RUNNER_TEMP/pull-request.md"

          number=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh pr edit "$number" --title "chore: update pinned tools" --body-file "$RUNNER_TEMP/pull-request.md"
          else
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "chore: update pinned tools" \
              --body-file "$RUNNER_TEMP/pull-request.md" \
              --label dependencies \
              --label security
          fi
          cat "$RUNNER_TEMP/pull-request.md" >> "$GITHUB_STEP_SUMMARY"
