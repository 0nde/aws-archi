name: Build and publish image

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - ".github/workflows/image.yml"
      - ".github/actions/image-security/**"
      - ".devcontainer/Dockerfile"
      - ".dockerignore"
      - "scripts/**"
      - "tests/**"
      - "tooling/**"
      - "third_party_licenses/**"
      - "LICENSE"
      - "NOTICE"
      - "THIRD_PARTY_NOTICES.md"
      - "SOURCE_OFFER.md"
  # Keep this trigger unfiltered: the two validation contexts are required by
  # the main-branch ruleset and must be reported for every pull request.
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      candidate_tag:
        description: Optional prerelease tag (X.Y.Z-rc.N) for the isolated GHCR candidate package
        type: string
        default: ""

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' && inputs.candidate_tag == '' }}

env:
  IMAGE_DOCKERHUB: haonde/aws-archi
  IMAGE_GHCR: ${{ inputs.candidate_tag != '' && 'ghcr.io/0nde/aws-archi-candidates' || 'ghcr.io/0nde/aws-archi' }}
  IMAGE_DESCRIPTION: "A hardened, multi-architecture development image for AWS, Terraform and CDK, published with a verifiable supply chain: pinned project-managed inputs, SBOM and provenance attestations, and keyless Cosign signatures."
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  validate:
    name: Validate image (${{ matrix.arch }})
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test the maintenance updater
        run: python -m unittest discover -s tests -p "test_*.py"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build validation image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: .devcontainer/Dockerfile
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          tags: aws-archi:test
          cache-from: type=gha,scope=aws-archi-${{ matrix.arch }}
          build-args: |
            RUNTIME_REFRESH=${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify tools and runtime defaults
        run: docker run --rm -v "$PWD/scripts:/tests:ro" aws-archi:test bash /tests/verify-tools.sh
      - name: Report vulnerabilities and enforce the security gate
        uses: ./.github/actions/image-security
        with:
          image-ref: aws-archi:test
          platform: ${{ matrix.platform }}
          artifact-name: vulnerabilities-pr-${{ matrix.arch }}

  publication-source:
    name: Verify publication source
    if: github.repository == '0nde/aws-archi' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.ref_type == 'tag'
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Validate channel and source
        env:
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -n "$CANDIDATE_TAG" ]]; then
            [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF_TYPE" == branch &&
               "$GITHUB_REF" != refs/heads/main &&
               "$CANDIDATE_TAG" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-rc\.[1-9][0-9]*$ ]]
          elif [[ "$GITHUB_REF_TYPE" == tag ]]; then
            python scripts/verify_release_candidate.py --source-only \
              --version "${GITHUB_REF_NAME#v}" --repository "$GITHUB_REPOSITORY" \
              --expected-commit "$GITHUB_SHA"
          else
            [[ "$GITHUB_REF" == refs/heads/main ]]
          fi

  publish-platform:
    name: Build, validate and stage platform (${{ matrix.arch }})
    needs: publication-source
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test the maintenance updater
        run: python -m unittest discover -s tests -p "test_*.py"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: platform-meta
        name: Generate OCI metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_GHCR }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,enable=${{ github.event_name == 'push' }}
            type=raw,value=${{ inputs.candidate_tag || 'unused' }},enable=${{ inputs.candidate_tag != '' }}
          labels: |
            org.opencontainers.image.title=AWS Architecture Development Environment
            org.opencontainers.image.description=${{ env.IMAGE_DESCRIPTION }}
            org.opencontainers.image.documentation=https://github.com/0nde/aws-archi#readme
            org.opencontainers.image.vendor=0nde
            org.opencontainers.image.licenses=Apache-2.0
      - id: build
        name: Build and stage platform by digest
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: .devcontainer/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,"name=${{ env.IMAGE_GHCR }}",push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.platform-meta.outputs.labels }}
          cache-from: type=gha,scope=aws-archi-${{ matrix.arch }}
          build-args: |
            RUNTIME_REFRESH=${{ github.run_id }}-${{ github.run_attempt }}
          # Every publication refreshes the runtime packages without discarding
          # immutable Go build layers. Normal pushes retain the resulting cache.
          cache-to: ${{ github.event_name == 'push' && format('type=gha,mode=min,scope=aws-archi-{0}', matrix.arch) || '' }}
          sbom: true
          provenance: mode=max
      - name: Verify the exact staged platform image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          ref="${IMAGE_GHCR}@${DIGEST}"
          docker pull --platform "$PLATFORM" "$ref"
          docker run --rm --platform "$PLATFORM" \
            -v "$PWD/scripts:/tests:ro" \
            "$ref" bash /tests/verify-tools.sh
      - name: Report staged image vulnerabilities and enforce the security gate
        uses: ./.github/actions/image-security
        with:
          image-ref: ${{ env.IMAGE_GHCR }}@${{ steps.build.outputs.digest }}
          platform: ${{ matrix.platform }}
          artifact-name: vulnerabilities-published-${{ matrix.arch }}
      - name: Export platform digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
      - name: Upload platform digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish-manifest:
    name: Publish multi-architecture manifest
    if: github.event_name != 'pull_request'
    needs: publish-platform
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-*
          path: /tmp/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_GHCR }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,enable=${{ github.event_name == 'push' }}
            type=raw,value=${{ inputs.candidate_tag || 'unused' }},enable=${{ inputs.candidate_tag != '' }}
      - id: manifest
        name: Stage canonical GHCR manifest
        run: |
          mapfile -t digests < <(find /tmp/digests -maxdepth 1 -type f -printf '%f\n' | sort)
          if [ "${#digests[@]}" -ne 2 ]; then
            echo "Expected two platform digests, found ${#digests[@]}" >&2
            exit 1
          fi

          sources=()
          for digest in "${digests[@]}"; do
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
            sources+=("${IMAGE_GHCR}@sha256:${digest}")
          done
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.description=${IMAGE_DESCRIPTION}" \
            --metadata-file "$RUNNER_TEMP/manifest.json" \
            --tag "${IMAGE_GHCR}:staging-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "${sources[@]}"
          digest=$(jq -r '."containerimage.descriptor".digest' "$RUNNER_TEMP/manifest.json")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Read pinned tool versions
        id: versions
        shell: bash
        run: |
          cosign_version=$(python scripts/update-pins.py --read-cosign-version)
          echo "cosign=${cosign_version}" >> "$GITHUB_OUTPUT"
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v${{ steps.versions.outputs.cosign }}
      - name: Sign and verify the index before tagging
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
          CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/image.yml@${{ github.ref }}
        run: |
          ref="${IMAGE_GHCR}@${DIGEST}"
          cosign sign --yes "$ref"
          cosign verify "$ref" --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null
      - name: Apply verified GHCR tags
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
          FINAL_TAGS: ${{ steps.meta.outputs.tags }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
        run: |
          tags=()
          while IFS= read -r tag; do
            if [[ "$tag" == "${IMAGE_GHCR}:"* ]]; then
              tags+=("$tag")
            fi
          done <<< "$FINAL_TAGS"
          test "${#tags[@]}" -gt 0
          bash scripts/tag-image.sh "$IMAGE_GHCR" "$DIGEST" \
            "${CANDIDATE_TAG:-${GITHUB_REF_NAME#v}}" "${tags[@]}"
    outputs:
      digest: ${{ steps.manifest.outputs.digest }}

  mirror-dockerhub:
    name: Mirror canonical image to Docker Hub
    if: inputs.candidate_tag == ''
    needs: publish-manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # GHCR is already published before this independent mirror is attempted.
    # A mirror failure remains visible without rolling back the canonical image.
    permissions:
      contents: read
      id-token: write
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to canonical GHCR registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_DOCKERHUB }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,enable=${{ github.event_name == 'push' }}
      - name: Stage the canonical index and attestations in the mirror
        env:
          DIGEST: ${{ needs.publish-manifest.outputs.digest }}
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE_DOCKERHUB}:staging-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            "${IMAGE_GHCR}@${DIGEST}"
      - name: Read pinned tool versions
        id: versions
        shell: bash
        run: |
          cosign_version=$(python scripts/update-pins.py --read-cosign-version)
          echo "cosign=${cosign_version}" >> "$GITHUB_OUTPUT"
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v${{ steps.versions.outputs.cosign }}
      - name: Sign and verify the mirror index before tagging
        env:
          DIGEST: ${{ needs.publish-manifest.outputs.digest }}
          CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/image.yml@${{ github.ref }}
        run: |
          ref="${IMAGE_DOCKERHUB}@${DIGEST}"
          cosign sign --yes "$ref"
          # Docker Hub can expose an uploaded signature after a short delay.
          for delay in 0 5 10 20 40 60; do
            if [ "$delay" -gt 0 ]; then
              sleep "$delay"
            fi
            if cosign verify "$ref" --certificate-identity "$CERTIFICATE_IDENTITY" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null; then
              exit 0
            fi
          done
          echo "Docker Hub signature verification did not succeed" >&2
          exit 1
      - name: Apply verified Docker Hub tags
        env:
          DIGEST: ${{ needs.publish-manifest.outputs.digest }}
          FINAL_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          mapfile -t tags <<< "$FINAL_TAGS"
          bash scripts/tag-image.sh "$IMAGE_DOCKERHUB" "$DIGEST" \
            "${GITHUB_REF_NAME#v}" "${tags[@]}"

  verify-publication:
    name: Verify published image
    if: always() && needs.publish-manifest.result == 'success'
    needs: [publish-manifest, mirror-dockerhub]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR for the isolated candidate package
        if: inputs.candidate_tag != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Read pinned tool versions
        id: versions
        shell: bash
        run: |
          cosign_version=$(python scripts/update-pins.py --read-cosign-version)
          echo "cosign=${cosign_version}" >> "$GITHUB_OUTPUT"
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v${{ steps.versions.outputs.cosign }}
      - name: Verify canonical publication and optional mirror
        env:
          EXPECTED_DIGEST: ${{ needs.publish-manifest.outputs.digest }}
          EXPECTED_REVISION: ${{ github.sha }}
          CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/image.yml@${{ github.ref }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
        run: |
          verify_image() {
            local ref="$1"
            local manifest sbom provenance image platform actual

            manifest=$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}')
            actual=$(jq -r '.digest' <<< "$manifest")
            test "$actual" = "$EXPECTED_DIGEST"
            jq -e --arg description "$IMAGE_DESCRIPTION" \
              '.annotations["org.opencontainers.image.description"] == $description' \
              <<< "$manifest" >/dev/null
            jq -e '([.manifests[] | select(.platform.os == "linux") | .platform.architecture] | sort) == ["amd64", "arm64"]' <<< "$manifest" >/dev/null

            for platform in linux/amd64 linux/arm64; do
              sbom=$(docker buildx imagetools inspect "$ref" --format "{{json (index .SBOM \"$platform\")}}")
              jq -e '.SPDX.spdxVersion and (.SPDX.packages | length > 0)' <<< "$sbom" >/dev/null

              provenance=$(docker buildx imagetools inspect "$ref" --format "{{json (index .Provenance \"$platform\")}}")
              jq -e '.SLSA.buildDefinition.buildType and .SLSA.runDetails.builder.id' <<< "$provenance" >/dev/null

              image=$(docker buildx imagetools inspect "$ref" --format "{{json (index .Image \"$platform\")}}")
              jq -e --arg revision "$EXPECTED_REVISION" \
                '.config.Labels["org.opencontainers.image.revision"] == $revision and
                 .config.Labels["org.opencontainers.image.source"] == "https://github.com/0nde/aws-archi" and
                 .config.Labels["org.opencontainers.image.licenses"] == "Apache-2.0"' \
                <<< "$image" >/dev/null
            done

            cosign verify "$ref" \
              --certificate-identity "$CERTIFICATE_IDENTITY" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null
          }

          verify_image "${IMAGE_GHCR}@${EXPECTED_DIGEST}"

          if [ -n "$CANDIDATE_TAG" ]; then
            printf 'Verified candidate %s:%s at %s.\n' "$IMAGE_GHCR" "$CANDIDATE_TAG" "$EXPECTED_DIGEST" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if docker buildx imagetools inspect "${IMAGE_DOCKERHUB}@${EXPECTED_DIGEST}" >/dev/null 2>&1; then
            verify_image "${IMAGE_DOCKERHUB}@${EXPECTED_DIGEST}"
            echo "Docker Hub and GHCR expose the same verified digest." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GHCR is verified, but the Docker Hub mirror is unavailable. Re-run the workflow to retry the mirror."
            echo "Docker Hub mirror unavailable; GHCR publication verified successfully." >> "$GITHUB_STEP_SUMMARY"
          fi
